name: GitFind Lifecycle Scan

# Outcomes Ledger automation (Board Directive 2, Nov 6, 2026): the weekly
# writer for project_outcomes. Scans the repos table and records 'dead'
# outcomes for repos whose lifecycle has observably ended — archived on
# GitHub (dead/confirmed) or no pushes for 365+ days (dead/likely). It
# writes ONLY 'dead' rows; every other event type in the ledger comes from
# the news sweep or manual entry (see docs/outcomes-ledger.md).
#
# The scheduled run always writes (--write). Manual runs via
# workflow_dispatch default to a dry run — the detector prints what it
# WOULD insert and writes nothing — unless the `write` input is ticked.
# The scan is idempotent: repos that already have a 'dead' row are skipped,
# and a partial unique index enforces one 'dead' row per repo.

on:
  # Mondays 13:00 UTC — after the weekend pipelines and the 12:00 UTC
  # archive snapshot have completed.
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:
    inputs:
      write:
        description: 'Write outcomes (unticked = dry run, prints only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: lifecycle-scan
  cancel-in-progress: false

jobs:
  scan:
    name: Scan repo lifecycles into the Outcomes Ledger
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install tsx (TypeScript runner)
        run: npm install -g tsx

      - name: Run lifecycle scan
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.write }}" = "true" ]; then
            echo "Writing mode: inserting new 'dead' outcomes"
            npx tsx scripts/detect-lifecycle-outcomes.ts --write
          else
            echo "Dry run: printing what would be inserted, writing nothing"
            npx tsx scripts/detect-lifecycle-outcomes.ts
          fi

      # Via the API, not the gh CLI: a gh-based step in a job like this one
      # died with "failed to run git: fatal: not a git repository" on the
      # Archive Snapshot workflow's first run (Nov 6, 2026) and no issue was
      # ever opened. github-script talks to the API directly.
      - name: Open or update issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Lifecycle scan failing'
            const label = 'lifecycle-scan'
            const today = new Date().toISOString().slice(0, 10)
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              `## Lifecycle scan failed (${today})`,
              '',
              `Run: ${runUrl}`,
              '',
              'The weekly Outcomes Ledger scan did not complete, so new `dead` outcomes were not recorded this week. The scan is idempotent — once the failure is fixed, re-run this workflow (scheduled mode, or dispatch with `write` ticked) and it will pick up everything it missed.',
            ].join('\n')
            const { owner, repo } = context.repo
            try {
              await github.rest.issues.createLabel({
                owner, repo, name: label, color: 'd73a4a',
                description: 'GitFind lifecycle scan failures',
              })
            } catch (e) {
              if (e.status !== 422) throw e // 422 = label already exists
            }
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: label, per_page: 1,
            })
            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: open.data[0].number, body,
              })
            } else {
              await github.rest.issues.create({
                owner, repo, title, labels: [label], body,
              })
            }

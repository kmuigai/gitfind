name: GitFind News Sweep

on:
  schedule:
    # Tuesdays 13:00 UTC — offset one day from the lifecycle scan (Mondays 13:00 UTC).
    - cron: '0 13 * * 2'
  workflow_dispatch:
    inputs:
      write:
        description: 'Write outcomes (unticked = dry run, prints only)'
        type: boolean
        default: false
      limit:
        description: 'Max repos to sweep (blank = script default 25)'
        type: number
        required: false
      repo:
        description: 'Only sweep these repos, comma-separated owner/name (blank = all eligible)'
        type: string
        required: false
      since_days:
        description: 'News window in days (blank = script default 365)'
        type: number
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: news-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Detect news outcomes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install tsx (TypeScript runner)
        run: npm install -g tsx

      - name: Sweep news for outcomes
        run: |
          set -o pipefail
          DO_WRITE="${{ github.event_name == 'schedule' || inputs.write == true }}"
          ARGS=""
          if [ "$DO_WRITE" = "true" ]; then ARGS="$ARGS --write"; fi
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          if [ -n "${{ inputs.repo }}" ]; then ARGS="$ARGS --repo ${{ inputs.repo }}"; fi
          if [ -n "${{ inputs.since_days }}" ]; then ARGS="$ARGS --since-days ${{ inputs.since_days }}"; fi
          npx tsx scripts/detect-news-outcomes.ts $ARGS
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `News sweep failed (${new Date().toISOString().slice(0, 10)})`
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              '## News sweep failed',
              '',
              `Run: ${runUrl}`,
              '',
              'The scheduled/manual news sweep (`scripts/detect-news-outcomes.ts`) failed. See the run logs for the error.',
            ].join('\n')
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'news-sweep',
              state: 'open',
            })
            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['news-sweep'],
                body,
              })
            }

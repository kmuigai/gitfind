name: GitFind Outcomes Backfill

on:
  # Manual dispatch only — the backfill runs in supervised batches of 50
  # for the 2025–26 top-1,000 backfill. No schedule: batches are kicked off
  # by hand once the previous batch has been checked.
  workflow_dispatch:
    inputs:
      write:
        description: 'Write outcomes and check rows (unticked = dry run, writes nothing)'
        type: boolean
        default: false
      limit:
        description: 'Repos per batch (default 50)'
        type: number
        default: 50
      offset:
        description: 'Offset into the ranked top-1,000 list (blank = 0)'
        type: number
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: outcomes-backfill
  cancel-in-progress: false

jobs:
  backfill:
    name: Backfill outcomes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install tsx (TypeScript runner)
        run: npm install -g tsx

      - name: Run outcomes backfill
        run: |
          set -o pipefail
          ARGS=""
          if [ "${{ inputs.write }}" = "true" ]; then ARGS="$ARGS --write"; fi
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          if [ -n "${{ inputs.offset }}" ]; then ARGS="$ARGS --offset ${{ inputs.offset }}"; fi
          npx tsx scripts/backfill-outcomes.ts $ARGS
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Outcomes backfill failed (${new Date().toISOString().slice(0, 10)})`
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              '## Outcomes backfill failed',
              '',
              `Run: ${runUrl}`,
              '',
              'The manual outcomes backfill (`scripts/backfill-outcomes.ts`) failed. See the run logs for the error.',
            ].join('\n')
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'outcomes-backfill',
              state: 'open',
            })
            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['outcomes-backfill'],
                body,
              })
            }
